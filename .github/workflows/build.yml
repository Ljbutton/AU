name: Build

# Tests the core, compiles the BepInEx plugin against the Among Us game libraries,
# and packages a drop-in ZIP. Pushing a v* tag also publishes a GitHub Release.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_libs_version:
        description: 'AmongUs.GameLibs.Steam version to build against (blank = latest)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test the core
        run: dotnet test tests/TournamentTracker.Tests -c Release

      - name: Build the plugin
        run: >
          dotnet build src/TournamentTracker.Plugin -c Release
          ${{ inputs.game_libs_version && format('-p:GameLibsVersion={0}', inputs.game_libs_version) || '' }}

      - name: Show the game and BepInEx versions built against
        run: dotnet list src/TournamentTracker.Plugin package | tee versions.txt

      - name: Package
        run: |
          set -euo pipefail
          name="TournamentTracker-${GITHUB_REF_NAME//\//-}"
          root="dist/$name"
          mkdir -p "$root/BepInEx/plugins" "$root/BepInEx/config/TournamentTracker"
          cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$root/BepInEx/plugins/"
          cp examples/links.example.json "$root/BepInEx/config/TournamentTracker/"
          cp README.md LICENSE "$root/"
          grep -E 'AmongUs.GameLibs|BepInEx' versions.txt > "$root/BUILT-AGAINST.txt" || true
          (cd dist && zip -qr "$name.zip" "$name")
          echo "PKG_ZIP=dist/$name.zip" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Test the installer
        shell: pwsh
        run: ./installer/test/installer.tests.ps1

      - name: Build the one-click installer and the full bundle
        run: |
          set -euo pipefail
          # BepInEx be.735, the build Among Us mods use, straight from BepInEx's build server.
          href=$(curl -fsSL https://builds.bepinex.dev/projects/bepinex_be \
            | grep -oE 'href="[^"]*BepInEx-Unity\.IL2CPP-win-x64-6\.0\.0-be\.735[^"]*\.zip"' | head -1 | sed -E 's/^href="//; s/"$//') || true
          case "$href" in
            http*) url="$href" ;;
            /*) url="https://builds.bepinex.dev$href" ;;
            "") url="https://builds.bepinex.dev/projects/bepinex_be/735/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.735%2B5fef357.zip" ;;
            *) url="https://builds.bepinex.dev/projects/bepinex_be/$href" ;;
          esac
          echo "BepInEx from $url"
          curl -fsSL "$url" -o bepinex.zip
          full=dist/full
          mkdir -p "$full"
          unzip -q bepinex.zip -d "$full"
          test -f "$full/winhttp.dll"
          mkdir -p "$full/BepInEx/plugins"
          cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$full/BepInEx/plugins/"
          (cd "$full" && zip -qr ../TournamentTracker-Full.zip .)
          # The installer: a .bat that runs the PowerShell stored after its #PS-START line.
          { cat installer/Install-TournamentTracker.header.bat; echo '#PS-START'; cat installer/install.ps1; } \
            | sed 's/$/\r/' > dist/Install-TournamentTracker.bat
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.PKG_ZIP }}
            dist/TournamentTracker-Full.zip
            dist/Install-TournamentTracker.bat

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$PKG_ZIP" dist/TournamentTracker-Full.zip dist/Install-TournamentTracker.bat
          --title "$GITHUB_REF_NAME" --notes-file dist/*/BUILT-AGAINST.txt
