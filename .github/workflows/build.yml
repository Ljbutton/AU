name: Build

# Tests the core, compiles the BepInEx plugin against the Among Us game libraries,
# and packages a drop-in ZIP. Pushing a v* tag also publishes a GitHub Release.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_libs_version:
        description: 'AmongUs.GameLibs.Steam version to build against (blank = latest)'
        required: false
      release_tag:
        description: 'Publish a GitHub release with this tag, e.g. v1.0.1 (blank = just build)'
        required: false
      delete_tags:
        description: 'Delete these releases and tags first, space separated (blank = none)'
        required: false

permissions:
  contents: write

jobs:
  delete-releases:
    if: inputs.delete_tags != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.delete_tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Deleted release and tag $tag"
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" && echo "Deleted tag $tag" || echo "No tag $tag"
            fi
          done

  build:
    needs: delete-releases
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test the core
        run: dotnet test tests/TournamentTracker.Tests -c Release

      - name: Build the plugin
        run: >
          dotnet build src/TournamentTracker.Plugin -c Release
          ${{ inputs.game_libs_version && format('-p:GameLibsVersion={0}', inputs.game_libs_version) || '' }}

      - name: Build The Button, the app (Windows)
        run: >
          dotnet publish src/TournamentTracker.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o dist/app

      - name: Show the game and BepInEx versions built against
        run: dotnet list src/TournamentTracker.Plugin package | tee versions.txt

      - name: Package
        run: |
          set -euo pipefail
          name="TournamentTracker-${GITHUB_REF_NAME//\//-}"
          root="dist/$name"
          mkdir -p "$root/BepInEx/plugins" "$root/BepInEx/config/TournamentTracker"
          cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$root/BepInEx/plugins/"
          cp examples/links.example.json "$root/BepInEx/config/TournamentTracker/"
          cp README.md LICENSE "$root/"
          grep -E 'AmongUs.GameLibs|BepInEx' versions.txt > "$root/BUILT-AGAINST.txt" || true
          (cd dist && zip -qr "$name.zip" "$name")
          echo "PKG_ZIP=dist/$name.zip" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Test the installer
        shell: pwsh
        run: ./installer/test/installer.tests.ps1

      - name: Build the one-click installer and the full bundle
        run: |
          set -euo pipefail
          # BepInEx be.735, the build Among Us mods use, straight from BepInEx's build server.
          # Among Us is a 32-bit game, so it must be the win-x86 build: the x64 one never loads.
          href=$(curl -fsSL https://builds.bepinex.dev/projects/bepinex_be \
            | grep -oE 'href="[^"]*BepInEx-Unity\.IL2CPP-win-x86-6\.0\.0-be\.735[^"]*\.zip"' | head -1 | sed -E 's/^href="//; s/"$//') || true
          case "$href" in
            http*) url="$href" ;;
            /*) url="https://builds.bepinex.dev$href" ;;
            "") url="https://builds.bepinex.dev/projects/bepinex_be/735/BepInEx-Unity.IL2CPP-win-x86-6.0.0-be.735%2B5fef357.zip" ;;
            *) url="https://builds.bepinex.dev/projects/bepinex_be/$href" ;;
          esac
          echo "BepInEx from $url"
          curl -fsSL "$url" -o bepinex.zip
          full=dist/full
          mkdir -p "$full"
          unzip -q bepinex.zip -d "$full"
          test -f "$full/winhttp.dll"
          # Refuse to ship a 64-bit loader: "PE32 executable ... Intel 80386" is 32-bit, "PE32+ ... x86-64" is not.
          file "$full/winhttp.dll"
          file "$full/winhttp.dll" | grep -q 'Intel 80386' || { echo "::error::BepInEx loader is not 32-bit"; exit 1; }
          mkdir -p "$full/BepInEx/plugins"
          cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$full/BepInEx/plugins/"
          (cd "$full" && zip -qr ../TournamentTracker-Full.zip .)
          # The installer: a .bat that runs the PowerShell stored after its #PS-START line.
          { cat installer/Install-TournamentTracker.header.bat; echo '#PS-START'; cat installer/install.ps1; } \
            | sed 's/$/\r/' > dist/Install-TheButton.bat
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.PKG_ZIP }}
            dist/TournamentTracker-Full.zip
            dist/Install-TheButton.bat
            dist/app/TheButton.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo "Download **Install-TheButton.bat** below and double-click it (host only). It installs"
            echo "**The Button**, the app that installs the mod into Among Us and runs everything:"
            echo "setup code, rounds, automute, voids, links and replays. Nothing is typed in the game chat."
            echo "If Windows says it protected your PC, click More info, then Run anyway."
            echo
            echo "Already have the app? It offers the update itself on its Home page."
            echo
            echo "Built from commit $GITHUB_SHA against:"
            cat dist/*/BUILT-AGAINST.txt
          } > notes.md
          # Creates the tag on GitHub at this commit if it doesn't exist yet.
          gh release create "$TAG" "$PKG_ZIP" dist/TournamentTracker-Full.zip dist/Install-TheButton.bat dist/app/TheButton.exe \
            --target "$GITHUB_SHA" --title "Tournament Tracker $TAG" --notes-file notes.md --latest
