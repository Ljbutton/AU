name: Build

# Tests the core, compiles the BepInEx plugin against the Among Us game libraries,
# and packages a drop-in ZIP. Pushing a v* tag also publishes a GitHub Release of The Button
# and the mod; pushing a broadcast-v* tag publishes Red Alert on its own (a pre-release
# while it's in beta, never "latest", so The Button's updates never see it).
# The windows job builds and tests the same on Windows and starts the apps and the installers.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_libs_version:
        description: 'AmongUs.GameLibs.Steam version to build against (blank = latest)'
        required: false
      release_tag:
        description: 'Publish a GitHub release with this tag: v1.0.1 (The Button + mod) or broadcast-v0.1.0 (Red Alert); blank = just build'
        required: false
      delete_tags:
        description: 'Delete these releases and tags first, space separated (blank = none)'
        required: false

permissions:
  contents: write

jobs:
  delete-releases:
    if: inputs.delete_tags != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.delete_tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Deleted release and tag $tag"
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" && echo "Deleted tag $tag" || echo "No tag $tag"
            fi
          done

  build:
    needs: delete-releases
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Test the core and The Button
        run: dotnet test tests/TournamentTracker.Tests -c Release

      - name: Test Red Alert
        run: dotnet test tests/TournamentTracker.Broadcast.Tests -c Release

      - name: Build the plugin
        run: >
          dotnet build src/TournamentTracker.Plugin -c Release
          ${{ inputs.game_libs_version && format('-p:GameLibsVersion={0}', inputs.game_libs_version) || '' }}

      - name: Build The Button, the app (Windows)
        run: >
          dotnet publish src/TournamentTracker.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o dist/app

      - name: Build Red Alert, the broadcaster's app (Windows)
        run: >
          dotnet publish src/TournamentTracker.BroadcastApp -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o dist/broadcast

      - name: Show the game and BepInEx versions built against
        run: dotnet list src/TournamentTracker.Plugin package | tee versions.txt

      - name: Package
        env:
          REF: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="TournamentTracker-Mod-${REF//\//-}"
          root="dist/$name"
          mkdir -p "$root/BepInEx/plugins"
          cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$root/BepInEx/plugins/"
          cp README.md LICENSE "$root/"
          grep -E 'AmongUs.GameLibs|BepInEx' versions.txt > "$root/BUILT-AGAINST.txt" || true
          (cd dist && zip -qr "$name.zip" "$name")
          echo "PKG_ZIP=dist/$name.zip" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Test the installers
        shell: pwsh
        run: |
          ./installer/test/installer.tests.ps1
          ./installer/test/install-redalert.tests.ps1

      # BepInEx's build server often drops downloads, so keep the files once we have them.
      - name: Cache BepInEx be.735 (win-x86)
        uses: actions/cache@v5
        with:
          path: bepinex.zip
          key: bepinex-be735-win-x86

      - name: Cache BepInEx be.735 (win-x64)
        uses: actions/cache@v5
        with:
          path: bepinex-x64.zip
          key: bepinex-be735-win-x64

      - name: Build the one-click installer and the full bundles
        run: |
          set -euo pipefail
          # BepInEx be.735, the build Among Us mods use, straight from BepInEx's build server.
          # The loader has to match the game: Among Us was 32-bit (win-x86) until its 29 September
          # 2026 update made it 64-bit (win-x64). The Button installs the 64-bit one; the 32-bit
          # one is shipped too, for installing by hand on an older patch.
          fetch() {
            local arch=$1 out=$2 href url
            if [ -s "$out" ] && unzip -tq "$out" >/dev/null; then echo "BepInEx win-$arch from the cache"; return; fi
            href=$(curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 https://builds.bepinex.dev/projects/bepinex_be \
              | grep -oE "href=\"[^\"]*BepInEx-Unity\.IL2CPP-win-$arch-6\.0\.0-be\.735[^\"]*\.zip\"" | head -1 | sed -E 's/^href="//; s/"$//') || true
            case "$href" in
              http*) url="$href" ;;
              /*) url="https://builds.bepinex.dev$href" ;;
              "") url="https://builds.bepinex.dev/projects/bepinex_be/735/BepInEx-Unity.IL2CPP-win-$arch-6.0.0-be.735%2B5fef357.zip" ;;
              *) url="https://builds.bepinex.dev/projects/bepinex_be/$href" ;;
            esac
            echo "BepInEx win-$arch from $url"
            curl -fsSL --http1.1 --retry 8 --retry-all-errors --retry-delay 10 -C - "$url" -o "$out"
          }
          fetch x86 bepinex.zip
          fetch x64 bepinex-x64.zip
          for arch in x86 x64; do
            if [ "$arch" = x86 ]; then zipfile=bepinex.zip; expect='Intel 80386'; else zipfile=bepinex-x64.zip; expect='x86-64'; fi
            full="dist/full-$arch"
            mkdir -p "$full"
            unzip -q "$zipfile" -d "$full"
            test -f "$full/winhttp.dll"
            # Make sure each bundle's loader is the bitness it's named for:
            # "PE32 executable ... Intel 80386" is 32-bit, "PE32+ executable ... x86-64" is 64-bit.
            file "$full/winhttp.dll"
            file "$full/winhttp.dll" | grep -q "$expect" || { echo "::error::The win-$arch BepInEx loader isn't $arch"; exit 1; }
            mkdir -p "$full/BepInEx/plugins"
            cp src/TournamentTracker.Plugin/bin/Release/net6.0/TournamentTracker.dll "$full/BepInEx/plugins/"
            (cd "$full" && zip -qr "../TournamentTracker-Full-$arch.zip" .)
          done
          # The Button v0.1.13 and older only know this name (and need it to find their own
          # updates), so keep it. It's the 64-bit bundle, for the newest Among Us patch.
          cp dist/TournamentTracker-Full-x64.zip dist/TournamentTracker-Full.zip
          # The installer: a .bat that runs the PowerShell stored after its #PS-START line.
          { cat installer/Install-TournamentTracker.header.bat; echo '#PS-START'; cat installer/install.ps1; } \
            | sed 's/$/\r/' > dist/Install-TheButton.bat
          # Red Alert's installer downloads the RedAlert.exe of its own release.
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/TournamentTracker.BroadcastApp/TournamentTracker.BroadcastApp.csproj)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/broadcast-v$version/RedAlert.exe"
          { cat installer/Install-RedAlert.header.bat; echo '#PS-START'; sed "s#__TTB_URL__#$url#" installer/install-redalert.ps1; } \
            | sed 's/$/\r/' > dist/Install-RedAlert.bat
          # Installs from before the rename (TT Broadcast 0.1.0) update themselves by this name.
          cp dist/broadcast/RedAlert.exe dist/broadcast/TTBroadcast.exe
          echo "BROADCAST_VERSION=$version" >> "$GITHUB_ENV"
          ls -la dist

      # Red Alert's Stream Deck plugin (tools/streamdeck-plugin, Node.js). It ships with Red Alert's
      # releases, so on The Button's v* releases a problem here only warns and never stops them.
      - uses: actions/setup-node@v5
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v') }}
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/streamdeck-plugin/package-lock.json

      - name: Test and pack the Stream Deck plugin
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v') }}
        working-directory: tools/streamdeck-plugin
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          # Packed with Red Alert's version (written into the packed manifest), so the Stream Deck
          # app shows which Red Alert it came with.
          npx streamdeck pack com.ljbutton.redalert.sdPlugin --output dist --force --no-update-check --version "$BROADCAST_VERSION"
          cp dist/com.ljbutton.redalert.streamDeckPlugin ../../dist/RedAlert.streamDeckPlugin
          ls -la ../../dist/RedAlert.streamDeckPlugin

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.PKG_ZIP }}
            dist/TournamentTracker-Full-x86.zip
            dist/TournamentTracker-Full-x64.zip
            dist/TournamentTracker-Full.zip
            dist/Install-TheButton.bat
            dist/app/TheButton.exe
            dist/Install-RedAlert.bat
            dist/broadcast/RedAlert.exe
            dist/RedAlert.streamDeckPlugin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo "Download **Install-TheButton.bat** below and double-click it (host only). It installs"
            echo "**The Button**, the app that installs the mod into Among Us and runs everything:"
            echo "setup code, rounds, automute, voids, links and replays. Nothing is typed in the game chat."
            echo "If Windows says it protected your PC, click More info, then Run anyway."
            echo
            echo "Organisers: download **setup-codes.html** below and open it in your browser to make the"
            echo "setup codes (it runs on your PC only; nothing you type leaves it)."
            echo
            echo "Already have the app? It shows \"New version available\" at the top; update from Settings."
            echo
            echo "The Button installs the 64-bit mod loader the newest Among Us needs (the game is 64-bit"
            echo "since its 29 September 2026 update). Installing by hand? Use TournamentTracker-Full-x64.zip;"
            echo "TournamentTracker-Full-x86.zip is only for 32-bit Among Us from before that patch."
            echo
            echo "Built from commit $GITHUB_SHA against:"
            cat dist/*/BUILT-AGAINST.txt
          } > notes.md
          # Creates the tag on GitHub at this commit if it doesn't exist yet.
          gh release create "$TAG" "$PKG_ZIP" dist/TournamentTracker-Full-x86.zip dist/TournamentTracker-Full-x64.zip \
            dist/TournamentTracker-Full.zip dist/Install-TheButton.bat dist/app/TheButton.exe docs/setup-codes.html \
            --target "$GITHUB_SHA" --title "The Button $TAG" --notes-file notes.md --latest

      - name: Publish Red Alert release
        if: startsWith(github.ref, 'refs/tags/broadcast-v') || startsWith(inputs.release_tag, 'broadcast-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The tag has to match the app's own version (src/TournamentTracker.BroadcastApp/*.csproj).
          if [ "$TAG" != "broadcast-v$BROADCAST_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match Red Alert's version $BROADCAST_VERSION"; exit 1
          fi
          {
            echo "## Red Alert (beta)"
            echo "The broadcaster's app: the caster desk, OBS control, replays and montages, the on-stream"
            echo "graphics, Twitch and simulation mode. Only whoever runs the stream needs it; hosts don't."
            echo
            echo "Download **Install-RedAlert.bat** below and double-click it. The first time it opens it"
            echo "takes your caster setup (OBS, priorities, keys, roster, administration code) from The Button"
            echo "on the same PC. It never updates by itself, so nothing changes in the middle of a stream:"
            echo "Settings → Updates says when a new version is out, and Update installs it when you choose."
            echo
            echo "TTBroadcast.exe is the same app, for copies from before the rename (v0.1, v0.2 updated themselves by name)."
            echo
            echo "Stream Deck: download **RedAlert.streamDeckPlugin** and double-click it to add Red Alert's keys"
            echo "(lobbies with live tally, player cameras, Preview and Take, replays, breaks) to the Stream Deck app,"
            echo "then paste the port and key from Red Alert (Settings → Stream Deck). See docs/stream-deck.md."
            echo
            echo "Built from commit $GITHUB_SHA."
          } > broadcast-notes.md
          gh release create "$TAG" dist/broadcast/RedAlert.exe dist/Install-RedAlert.bat dist/broadcast/TTBroadcast.exe \
            dist/RedAlert.streamDeckPlugin \
            --target "$GITHUB_SHA" --title "Red Alert $TAG" --notes-file broadcast-notes.md --prerelease --latest=false

  # The same build and tests on Windows, where the apps really run: their WebView2 windows, Red Alert's
  # global Mute all key, The Button's per-program audio capture, Windows' file locking and paths, and the
  # installers under Windows PowerShell 5.1. It runs beside the build above, on the same events, and
  # nothing waits for it: releases are still built and published by the build above alone.
  windows:
    name: Windows (build, tests, the apps, the installers)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      # Releases are built on Linux from the files as committed (LF line endings): test those, not the
      # CRLF copies Git makes on Windows by default.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # For the Stream Deck plugin, and the test that runs the Live desk's script in Node.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/streamdeck-plugin/package-lock.json

      - name: Build the solution (the plugin too, from the BepInEx feed)
        env:
          GAME_LIBS: ${{ inputs.game_libs_version }}
        run: |
          $extra = @()
          if ($env:GAME_LIBS) { $extra += "-p:GameLibsVersion=$env:GAME_LIBS" }
          dotnet build TournamentTracker.sln -c Release @extra

      - name: Build The Button's and Red Alert's windows (net8.0-windows)
        if: ${{ !cancelled() }}
        run: |
          dotnet build src/TournamentTracker.App -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/TournamentTracker.BroadcastApp -c Release

      # A test that hangs is stopped after 5 minutes and named, rather than holding up the job.
      - name: Test the core and The Button
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: >
          dotnet test tests/TournamentTracker.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none
          --logger "trx;LogFileName=core-and-the-button.trx" --results-directory "$env:RUNNER_TEMP/windows-checks/tests"

      - name: Test Red Alert
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          # A watchdog: if the tests are still running after 4 minutes (they take about 2), every thread's stack
          # goes into this log, so a hang can be found without downloading anything.
          dotnet tool install --global dotnet-stack 2>&1 | Out-Null
          $watch = Start-Job -ScriptBlock {
            Start-Sleep -Seconds 240
            $tool = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-stack.exe'
            foreach ($p in Get-Process testhost -ErrorAction SilentlyContinue) {
              "==== Still running after 4 minutes: testhost $($p.Id). Every thread's stack:"
              if (Test-Path $tool) { & $tool report -p $p.Id 2>&1 } else { '(dotnet-stack isn''t installed)' }
            }
          }
          dotnet test tests/TournamentTracker.Broadcast.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none `
            --logger "trx;LogFileName=red-alert.trx" --results-directory "$env:RUNNER_TEMP/windows-checks/tests"
          $code = $LASTEXITCODE
          if ($watch.State -eq 'Running') { Stop-Job $watch } else { Receive-Job $watch }
          Remove-Job $watch -Force
          exit $code

      - name: Test and validate the Stream Deck plugin
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        working-directory: tools/streamdeck-plugin
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          # The Elgato CLI's check of the manifest and the files it names (needs no Stream Deck app).
          npm run validate

      - name: Publish TheButton.exe and RedAlert.exe (as released)
        if: ${{ !cancelled() }}
        run: |
          dotnet publish src/TournamentTracker.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/TournamentTracker.BroadcastApp -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/broadcast

      # Each app must start, keep running and answer on its own server (the script says what else it shows).
      - name: Start The Button and Red Alert
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./.github/scripts/windows-checks.ps1 -Apps

      # What the .bat installers run: syntax only PowerShell 7 knows fails here, then the installers' tests.
      - name: Check the installers with Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "This is PowerShell $($PSVersionTable.PSVersion), not Windows PowerShell 5.1." }
          $bad = 0
          foreach ($file in Get-ChildItem -Path installer -Recurse -Filter *.ps1) {
            $name = $file.FullName.Substring($PWD.Path.Length + 1).Replace('\', '/')
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -eq 0) { Write-Host "  $name parses"; continue }
            $bad++
            foreach ($e in $errors) { Write-Host "::error file=$name,line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($bad -gt 0) { exit 1 }
          foreach ($test in 'installer.tests.ps1', 'install-redalert.tests.ps1') {
            $global:LASTEXITCODE = 0
            & (Join-Path 'installer\test' $test)
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          exit $bad

      - name: Run the installers as a user would (the .bat files, Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: ./.github/scripts/windows-checks.ps1 -Installers

      - name: Keep the logs, screenshots and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-checks
          path: ${{ runner.temp }}/windows-checks
          if-no-files-found: ignore
          retention-days: 14
